        var canonical = [

          '/credits/',
          '/MilmoePortfolio.pdf',
          '/MilmoeResumeQ4_2026.pdf',
          '/MilmoeResumeQ3_2026.pdf'

        function key(p) {
          var k;
          try { k = decodeURIComponent(p); } catch (e) { k = p; }
          k = k.toLowerCase().replace(/\/index\.html$/, '/').replace(/\/+$/, '');
          return k === '' ? '/' : k;
        }
        var path = location.pathname;
        var want = key(path);
        for (var i = 0; i < canonical.length; i++) {
          var target = canonical[i];
          // The exact-match guard prevents a redirect loop if the canonical
          // file itself is missing on a given host.
          if (key(target) === want && target !== path) {
            location.replace(target + location.search + location.hash);
            return;
          }
        }
      })();
    </script>
